name = "rumocerto-mz-api"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "PLANOS"
class_name = "PlanoJob"

[[durable_objects.bindings]]
name = "LIMITES"
class_name = "LimiteEnvios"

[[migrations]]
tag = "v3_3_sqlite"
new_sqlite_classes = ["PlanoJob", "LimiteEnvios"]

[triggers]
crons = ["*/15 * * * *"]
